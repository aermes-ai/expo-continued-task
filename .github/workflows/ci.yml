name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm test
      # The declarations are checked against the real React Native, expo-modules-core and expo-notifications types (the peers an app has).
      - run: npm install --no-save --no-audit --no-fund typescript@5 react-native@0.81 expo-modules-core@3 expo-notifications@0.32
      - run: npx tsc -p types/tsconfig.json
      - run: npm pack --dry-run

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # ContinuedTask.swift's real code against a fake BackgroundTasks, on a simulator.
      - run: |
          udid=$(xcrun simctl list devices available | grep -m1 -Eo 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -Eo '[0-9A-F-]{36}')
          xcrun simctl boot "$udid"
          harness/run.sh "$udid"

  example:
    # The example app, built from the package source for the simulator: proves the config plugin,
    # autolinking and the Swift compile in a real Expo SDK 54 app. The runner's default Xcode
    # (16.x on macos-15) is new enough for SDK 54 (16.1+).
    runs-on: macos-15
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: xcodebuild -version
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild -p ios --no-install
        env:
          CI: 1
      - run: pod install
        working-directory: example/ios
      - run: |
          set -o pipefail
          xcodebuild -workspace ios/*.xcworkspace -scheme ContinuedTaskExample -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 50
